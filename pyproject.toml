[project]
name = "one-os-ha-addon"
version = "0.1.6"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.116.1", "uvicorn[standard]==0.35.0", "sqlalchemy==2.0.43", "alembic==1.16.5", "httpx==0.28.1", "websockets==15.0.1", "pydantic-settings==2.10.1"]
[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0", "ruff==0.12.11", "pip-audit==2.9.0", "pyyaml>=6.0.3", "httpx2>=2.9.1"]
[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[tool.hatch.build.targets.wheel]
packages=["one_os_edge/backend/one_os_addon"]
[tool.pytest.ini_options]
testpaths=["one_os_edge/backend/tests"]
pythonpath=["one_os_edge/backend"]
filterwarnings=["error"]
[tool.ruff]
line-length=100
target-version="py313"
[tool.ruff.lint]
select=["E","F","I","B","UP","S"]
ignore=["S101"]
